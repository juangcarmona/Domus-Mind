name: backend-ci

on:
  # No path filter here on purpose. A path-filtered workflow reports no check
  # run at all, and a required status check that never reports leaves the pull
  # request blocked forever. Instead this always runs and the build job is
  # gated on the `changes` job below: when the pull request touches nothing
  # relevant the job is skipped, and a skipped check run satisfies the
  # requirement.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'DomusMind.slnx'
  workflow_dispatch:

jobs:
  changes:
    name: backend changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          echo "$files"
          if printf '%s\n' "$files" | grep -qE '^(src/backend/|tests/backend/|DomusMind\.slnx$|\.github/workflows/backend-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: backend build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DomusMind.slnx

      - name: Build
        run: dotnet build DomusMind.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DomusMind.slnx --no-build --configuration Release

      - name: Publish API
        run: |
          dotnet publish src/backend/DomusMind.Api/DomusMind.Api.csproj \
          -c Release \
          -o artifact/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: domusmind-api
          path: artifact/api
